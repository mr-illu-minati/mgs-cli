name: Publish to PyPI

# Publishes to PyPI when you create a GitHub Release. Uses PyPI Trusted Publishing
# (OIDC) — no API token stored. One-time setup on PyPI: add a "pending publisher" for
# project `mgs-cli` trusting owner `mr-illu-minati`, repo `mgs-cli`, workflow
# `publish.yml`, environment `pypi`.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build
      - name: Publish (trusted publishing)
        run: uv publish
