name: Publish to PyPI

# Publishes to PyPI on a GitHub Release via Trusted Publishing (OIDC, no stored token).

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Publish (trusted publishing)
        run: uv publish
